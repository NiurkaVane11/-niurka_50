    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --font:
          "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f7f6fa;
        font-family: var(--font);
        color: #111;
      }

      .card {
        position: relative;
        width: 100%;
        max-width: 400px;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 15% 55%,
            rgba(255, 130, 200, 0.75) 0%,
            transparent 55%
          ),
          radial-gradient(
            circle at 90% 90%,
            rgba(150, 100, 255, 0.85) 0%,
            transparent 55%
          ),
          linear-gradient(180deg, #ffa6d8 0%, #e79bf0 45%, #b98af5 100%);
        display: flex;
        flex-direction: column;
      }

      .hero {
        position: absolute;
        inset: 0 0 auto 0;
        height: 62%;
        background: url("download.jpg") center top / cover no-repeat;
        -webkit-mask-image: linear-gradient(
          to bottom,
          #000 55%,
          transparent 100%
        );
        mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
      }

      .content {
        position: relative;
        z-index: 1;
        margin-top: 42vh;
        padding: 0 20px 32px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }

      h1 {
        font-size: 1.9rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sparkle {
        width: 64px;
        height: 32px;
        color: #111;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .subtitle {
        margin-top: 6px;
        font-family: var(--font);
        font-size: 0.85rem;
        font-weight: 500;
      }

      .icons {
        display: flex;
        gap: 22px;
        margin: 18px 0 32px;
      }
      .icons a {
        color: #111;
        display: block;
        transition: transform 0.15s;
      }
      .icons a:hover {
        transform: scale(1.15);
      }
      .icons svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .btn {
        position: relative;
        width: 100%;
        padding: 16px 56px;
        margin-bottom: 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.45);
        border: 2.5px solid #111;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: #111;
        text-decoration: none;
        font-family: var(--font);
        font-weight: 500;
        font-size: 0.85rem;
        text-transform: lowercase;
        transition:
          background 0.15s,
          transform 0.15s,
          box-shadow 0.15s;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.65);
        transform: translateY(-2px);
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      }

      .btn .dot {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn .dot svg {
        width: 34px;
        height: 34px;
        image-rendering: pixelated;
      }

      .copyright {
        margin-top: auto;
        padding-top: 18px;
        font-size: 0.72rem;
        font-weight: 500;
      }

      @media (min-width: 500px) {
        body {
          padding: 32px 0;
        }
        .card {
          min-height: 720px;
          height: 720px;
          border-radius: 32px;
          box-shadow: 0 20px 60px rgba(150, 80, 190, 0.3);
        }
        .content {
          margin-top: 300px;
        }
      }
    </style>
